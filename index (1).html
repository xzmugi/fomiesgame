<style>
:root{--bg:#120f1f;--panel:#1b1631;--card:#252041;--card2:#2f2955;--line:#3d3566;--tx:#f3eeff;--mut:#a79cd0;--pur:#8c6bdc;--mint:#9fe7c0;--yel:#ffd400;--bad:#ff5a6e;--good:#5dff9c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 700px at 20% -10%,#2a1f55 0,transparent 60%),radial-gradient(900px 600px at 100% 0,#1f3a4a 0,transparent 55%),var(--bg);color:var(--tx);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.hidden{display:none!important}
#app{max-width:1560px;margin:0 auto;padding:12px}
/* HUD */
#hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:12px}
.brand{display:flex;flex-direction:column;justify-content:center;padding:4px 14px 4px 6px;line-height:1}
.logo{font-weight:700;font-size:26px;color:var(--yel);letter-spacing:.02em;text-shadow:0 3px 0 #5b36b8}
.logo small{display:block;font-size:12px;letter-spacing:.42em;color:var(--mint);text-shadow:none;margin-top:3px}
#tierName{font-size:11px;color:var(--mut);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 14px;display:flex;flex-direction:column;justify-content:center;min-width:112px;gap:2px}
.stat label{font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:600}
.stat b{font-size:22px;font-weight:700;line-height:1.1}
#cash{color:var(--mint)} #cash.neg{color:var(--bad)}
.stars{position:relative;font-size:21px;letter-spacing:2px;line-height:1;width:max-content}
.stars-bg{color:#3a3360}.stars-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--yel)}
.rep-row{display:flex;align-items:center;gap:8px}.rep-row span{font-size:14px;color:var(--mut);font-weight:600}
.bar{height:10px;background:#120d24;border-radius:6px;overflow:hidden;border:1px solid #2c2550}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--mint);transition:width .15s linear}
.bar.slim{height:7px}
.morale-row{display:flex;align-items:center;gap:8px}.morale-row .bar{width:90px}.morale-row span{font-size:14px;font-weight:700}
.controls{margin-left:auto;display:flex;gap:6px;align-items:center}
.ctl{background:var(--panel);border:2px solid var(--line);color:var(--tx);border-radius:12px;min-width:44px;height:44px;font-size:16px;font-weight:700;cursor:pointer}
.ctl:hover{border-color:var(--pur)}.ctl.on{background:var(--pur);border-color:#b9a2ff}
/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;align-items:start}
#canvasWrap{position:relative;border:3px solid var(--pur);border-radius:18px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.55)}
#c{display:block;width:100%;touch-action:manipulation}
#hint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(28,18,58,.94);border:2px solid var(--pur);border-radius:14px;padding:10px 40px 10px 14px;font-size:15px;line-height:1.35}
#hint button{position:absolute;right:8px;top:8px;background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer}
#tip{position:absolute;pointer-events:none;background:rgba(18,12,36,.95);border:2px solid var(--pur);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.35;z-index:5;white-space:nowrap}
#log{margin-top:10px;font-size:13px;color:#d3c9f3;min-height:58px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
#log em,.logbox em{font-style:normal;color:var(--mut);margin-right:6px;font-size:12px}
#side{background:var(--panel);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:10px;max-height:calc(100vh - 24px)}
#tabs{display:flex;background:#150f28;border-bottom:2px solid var(--line)}
#tabs button{flex:1;background:none;border:0;color:var(--mut);font-weight:600;font-size:14px;padding:12px 4px;cursor:pointer;position:relative;border-bottom:3px solid transparent}
#tabs button.on{color:var(--tx);border-bottom-color:var(--yel);background:#1d1635}
#bdgProjects{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:16px}
#panel{overflow:auto;padding:4px 12px 14px;flex:1;min-height:300px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mint);margin:14px 2px 6px}
.sec-h span{font-size:12px;color:var(--mut);letter-spacing:0;text-transform:none}
.empty{color:var(--mut);font-size:13px;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:12px;text-align:center}
.proj,.offer,.mate,.item,.tier-card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.proj.pri{border-color:var(--yel)}.proj.late{border-color:var(--bad);background:#33203a}
.offer.vip,.proj .p-name em{border-color:#ffb347}
em{font-style:normal;background:#ffb347;color:#2b1a00;border-radius:6px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700;vertical-align:middle}
.offer.vip{background:linear-gradient(#3a2b44,#252041);border-color:#ffb347}
.p-top{display:flex;gap:8px;align-items:center}
.emo{font-size:26px;width:38px;height:38px;display:grid;place-items:center;background:#171230;border-radius:10px;flex:none}
.p-name{font-weight:600;font-size:15px;flex:1;line-height:1.2}.p-name small{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-top:2px}
.icon-btn{background:#171230;border:2px solid var(--line);color:var(--mut);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
.icon-btn.on{background:var(--yel);color:#2b2000;border-color:var(--yel)}
.needs{margin:8px 0 4px}.need{display:grid;grid-template-columns:24px 1fr 62px;gap:6px;align-items:center;margin:4px 0}
.need .nt{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.p-foot{display:flex;align-items:center;gap:10px;margin-top:6px}.p-foot .pay{font-weight:700;color:var(--mint)}
.due{margin-left:auto;font-size:12px;font-weight:600}.due.ok{color:var(--mint)}.due.warn{color:#ffb347}.due.bad{color:var(--bad)}
.offer .p-foot .exp{flex:1;max-width:none}.offer .exp i{background:#7a6fb0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{background:#171230;border:1.5px solid var(--c,#3d3566);color:var(--tx);border-radius:9px;padding:2px 8px;font-size:12.5px;font-weight:600}
.chip.weak{opacity:.6;border-style:dashed}
.btn{background:var(--card2);color:var(--tx);border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;transition:transform .08s,border-color .15s,filter .15s}
.btn:hover{border-color:#b9a2ff;filter:brightness(1.1)}.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(#9d7df0,#7b58d0);border-color:#b9a2ff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}.btn.big{padding:12px 24px;font-size:18px;border-radius:14px}
.btn.off,.btn:disabled{opacity:.42;filter:grayscale(.5);cursor:not-allowed}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.btn-col{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:16px}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.avatar{width:54px;height:54px;border-radius:14px;border:3px solid var(--pur);object-fit:cover;flex:none;background:#000}
.avatar.big{width:84px;height:84px;border-radius:18px}.avatar.gray{filter:grayscale(.85) brightness(.75)}
.mate{padding:8px}.mate.sel{border-color:var(--yel)}
.m-row{display:flex;gap:10px;align-items:center;cursor:pointer}.off-staff{display:flex;gap:10px;align-items:center}
.m-main{flex:1;min-width:0}.m-name{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.role{background:#171230;border:1.5px solid var(--c);border-radius:8px;padding:0 7px;font-size:11.5px;font-weight:600}
.lv{margin-left:auto;font-size:12px;color:var(--yel)}
.m-bars{display:grid;gap:3px;margin:5px 0 3px}.m-bars .en{background:linear-gradient(90deg,#ffb300,#ffd400)}.m-bars .mo{background:#ff8fb1}
.m-sub{font-size:12.5px;color:#cfc6ee;line-height:1.3}.dim{color:var(--mut)!important;font-size:12px}
.m-detail{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:13px}.m-detail p{margin:4px 0}
.ability{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-top:8px;border-color:var(--yel);background:#3a2f1f}
.ability span{grid-column:1;font-size:12px;font-weight:500;color:#e8dcc0}.ability i{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;background:var(--yel);color:#2b2000;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700}
.ability.off i{background:#555;color:#ddd}
.item{display:flex;gap:10px;align-items:center}.i-ico{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#171230;border-radius:12px;flex:none}.i-main{flex:1;min-width:0}
.pips{display:inline-flex;gap:3px;margin-left:8px}.pips i{width:9px;height:9px;border-radius:3px;background:#171230;border:1.5px solid var(--line)}.pips i.on{background:var(--mint);border-color:var(--mint)}
.tier-card .t-name{font-size:19px;font-weight:700}.tier-card p{margin:4px 0;font-size:13px;color:#cfc6ee}
.tier-card .btn{width:100%;margin-top:10px}.maxed{margin-top:10px;color:var(--yel);font-weight:600}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.st{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}.st b{display:block;font-size:17px}.st span{font-size:11px;color:var(--mut)}
.ach-grid{display:grid;gap:6px}.ach{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 10px;opacity:.5}.ach.got{opacity:1;border-color:var(--yel)}.ach b{display:block;font-size:13.5px}.ach span{font-size:12px;color:var(--mut)}
.logbox{font-size:12.5px;display:grid;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,22,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.card{background:linear-gradient(#2c2453,#1c1636);border:3px solid var(--pur);border-radius:22px;padding:24px 28px;max-width:540px;width:100%;max-height:94vh;overflow:auto;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.card h2{margin:0 0 8px;font-size:28px;color:var(--yel)}.card p{line-height:1.45;color:#ddd3fa}
.card.title{max-width:780px}.card.help-card{text-align:left}.card.report-card{text-align:left}.card.report-card h2{text-align:center}
.title-logo{font-size:clamp(44px,9vw,84px);font-weight:700;color:var(--yel);line-height:.95;text-shadow:0 5px 0 #5b36b8,0 10px 30px rgba(140,107,220,.6);letter-spacing:.02em}
.title-logo small{display:block;font-size:.3em;letter-spacing:.5em;color:var(--mint);text-shadow:none;margin-top:10px}
.tagline{color:var(--mut)!important;margin:14px 0 4px}
.cast-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0 6px}
.cast{display:flex;flex-direction:column;align-items:center;width:84px}.cast img{width:78px;height:78px;border-radius:18px;border:3px solid var(--pur);object-fit:cover}
.cast b{font-size:13px;margin-top:6px}.cast span{font-size:11px;color:var(--mut)}
.help{text-align:left;padding-left:20px;line-height:1.45;color:#ddd3fa;font-size:14.5px}.help li{margin:8px 0}
.keys{color:var(--mut)!important;font-size:13px}kbd{background:#171230;border:1.5px solid var(--line);border-radius:6px;padding:1px 7px;margin:0 2px;font-family:inherit}
.report{background:#171230;border:2px solid var(--line);border-radius:14px;padding:6px 14px;margin:10px 0;text-align:left}
.rrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}.rrow:last-child{border:0}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{background:#3a2a1f;border:2px solid #ffb347;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px;text-align:left}.note.bad{background:#3a1f2a;border-color:var(--bad)}
.tipline{color:var(--mut)!important;font-size:13px;margin:12px 0}
.top-perf{display:flex;gap:12px;align-items:center;background:#171230;border-radius:14px;padding:8px 12px;margin:10px 0}.top-perf img{width:54px;height:54px;border-radius:12px}.top-perf b{display:block;color:var(--yel)}.top-perf span{font-size:13px;color:var(--mut)}
.ev-emoji{font-size:64px;line-height:1}.event-card p{margin:6px 0 14px}.result{font-size:17px}
.choices{display:grid;gap:8px}.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:10px 14px}.choice b{font-size:16px}.choice span{font-size:13px;color:var(--mut);font-weight:500;margin-top:2px}
.hire-top{display:flex;gap:16px;align-items:center;text-align:left}.hire-top h2{margin:0}
#toasts{position:fixed;top:78px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
.toast{background:#241d44;border:2px solid var(--line);border-left:6px solid var(--pur);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;animation:tin .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.ach{border-left-color:var(--yel);background:#33290f}
.toast.out{opacity:0;transform:translateX(30px);transition:.4s}@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@media (max-width:1000px){
  main{grid-template-columns:1fr}#side{position:static;max-height:none}#panel{max-height:62vh}
  .controls{margin-left:0;width:100%;justify-content:flex-end}.stat{min-width:0;flex:1 1 130px;padding:6px 10px}.stat b{font-size:19px}
  .brand{width:100%;flex-direction:row;align-items:baseline;gap:10px}#tierName{margin:0}
  #toasts{top:auto;bottom:16px}
}

</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand"><div class="logo">FOMIES<small>COMPANY</small></div><div id="tierName"></div></div>
    <div class="stat"><label>CASH</label><b id="cash">$0</b></div>
    <div class="stat"><label id="dayLbl">DAY 1</label><b id="clock">9:00 AM</b><div class="bar slim"><i id="dayBar"></i></div></div>
    <div class="stat"><label>REPUTATION</label><div class="rep-row"><div class="stars"><div class="stars-bg">★★★★★</div><div class="stars-fg" id="repFg">★★★★★</div></div><span id="repNum">1.0</span></div></div>
    <div class="stat"><label>MORALE</label><div class="morale-row"><div class="bar"><i id="moraleBar"></i></div><span id="moraleTxt">80%</span></div></div>
    <div class="controls">
      <button class="ctl" id="spd0" title="Pause (Space)">⏸</button>
      <button class="ctl on" id="spd1" title="Normal speed (1)">1×</button>
      <button class="ctl" id="spd2" title="Fast (2)">2×</button>
      <button class="ctl" id="spd3" title="Faster (3)">3×</button>
      <button class="ctl" id="mute" title="Sound">🔊</button>
      <button class="ctl" id="menuBtn" title="Menu">☰</button>
    </div>
  </header>
  <main>
    <section id="stage">
      <div id="canvasWrap"><canvas id="c" width="960" height="560"></canvas><div id="hint" class="hidden"></div><div id="tip" class="hidden"></div></div>
      <div id="log"></div>
    </section>
    <aside id="side">
      <nav id="tabs">
        <button data-tab="projects" class="on">Projects<span id="bdgProjects"></span></button>
        <button data-tab="team">Team</button>
        <button data-tab="office">Office</button>
        <button data-tab="stats">Stats</button>
      </nav>
      <div id="panel"></div>
    </aside>
  </main>
</div>
<div id="modal" class="hidden"><div class="card" id="modalCard"></div></div>
<div id="toasts"></div>

'use strict';
/* ============ FOMIES COMPANY — state & helpers ============ */
let S = null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');

function newState() {
  const workers = {};
  FOMIES.forEach(f => {
    workers[f.id] = { hired: !!f.start, lvl: 1, desk: 1, energy: 100, mood: 80, pts: 0, dpts: 0, cd: 0, pep: 0, cof: 0 };
  });
  return {
    v: 1, day: 1, minute: DAY_START, cash: 1500, rep: 1, tier: 0,
    totalRev: 0, done: 0, onTime: 0, late: 0, failed: 0, bestDay: 0, coffees: 0,
    workers, items: { coffee: 0, plants: 0, ping: 0, rack: 0, board: 0, billboard: 0 },
    active: [], offers: [], nid: 1, nextOfferT: 0,
    today: { rev: 0, done: 0, exp: 0, repStart: 1 },
    ach: {}, won: false, tip: 0, dayEvents: [], lastEvents: [], log: [],
  };
}

function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw), base = newState();
    S = Object.assign(base, d);
    S.workers = {};
    FOMIES.forEach(f => { S.workers[f.id] = Object.assign({}, base.workers[f.id], (d.workers || {})[f.id]); });
    S.items = Object.assign({}, base.items, d.items);
    S.today = Object.assign({}, base.today, d.today);
    return true;
  } catch (e) { return false; }
}

const tNow = () => (S.day - 1) * DAY_MIN + (S.minute - DAY_START);
const hiredList = () => FOMIES.filter(f => S.workers[f.id].hired);
const staffCount = () => hiredList().length;
const capacity = () => TIERS[S.tier].cap;
const maxSlots = () => 2 + S.items.rack;
const isHired = id => S.workers[id].hired;
const roleHired = r => FOMIES.some(f => f.role === r && S.workers[f.id].hired);
const salaryOf = f => Math.round(f.salary * (1 + 0.12 * (S.workers[f.id].lvl - 1)));
const trainCost = lvl => Math.round(120 * Math.pow(lvl, 2.1) / 10) * 10;
const deskCost = lvl => Math.round(150 * Math.pow(lvl, 1.9) / 10) * 10;
const itemCost = it => Math.round(it.base * Math.pow(it.grow, S.items[it.id]) / 10) * 10;
const MAX_LVL = 8, MAX_DESK = 5;

function fmtClock(minute) {
  const m = Math.floor(minute), h = Math.floor(m / 60), mm = m % 60;
  const ap = h >= 12 ? 'PM' : 'AM', h12 = ((h + 11) % 12) + 1;
  return h12 + ':' + String(mm).padStart(2, '0') + ' ' + ap;
}

'use strict';
/* ============ FOMIES COMPANY — simulation ============ */
const R = {
  speed: 1, paused: false, modalOpen: false, time: 0, w: {}, buff: { until: -1, mult: 1 },
  parts: [], floats: [], sel: null, hover: null, staticDirty: true, achT: 0, saveT: 0,
};

function seatOf(f) { const d = DESKS[f.slot]; return { x: d.x, y: d.y + 16 }; }
function initRuntime() {
  R.w = {};
  FOMIES.forEach(f => {
    const s = seatOf(f);
    R.w[f.id] = { x: s.x, y: s.y, state: 'seat', path: [], walking: false, spotKind: null, bob: Math.random() * 6,
      say: '', sayT: 0, sayNext: rand(5, 14), task: null, forced: false, face: 1, workFx: 0, restUntil: 0 };
  });
  R.parts = []; R.floats = []; R.buff = { until: -1, mult: 1 }; R.sel = null; R.staticDirty = true;
}

/* ---------- derived numbers ---------- */
function efficiency(w) {
  return clamp(0.35 + 0.65 * w.energy / 100, 0.35, 1) * (0.75 + 0.4 * w.mood / 100);
}
function teamMult() {
  const k = S.workers.king;
  return (1 + 0.02 * k.lvl * (k.hired ? 1 : 0)) * (R.buff.until > R.time ? R.buff.mult : 1);
}
function rateOf(f) {
  const w = S.workers[f.id];
  const spec = f.role === 'ceo' ? 0.62 : 1.25;
  return 1.05 * spec * (1 + 0.22 * (w.lvl - 1)) * (1 + 0.12 * (w.desk - 1)) * efficiency(w) * teamMult();
}

/* ---------- projects ---------- */
const remain = (p, r) => Math.max(0, (p.need[r] || 0) - (p.done[r] || 0));
function sortedActive() {
  return S.active.slice().sort((a, b) => (b.pri ? 1 : 0) - (a.pri ? 1 : 0) || a.dueDay - b.dueDay || a.id - b.id);
}
function pickTask(f) {
  const list = sortedActive();
  if (f.role !== 'ceo') {
    for (const p of list) if (remain(p, f.role) > 0.01) return { p, role: f.role };
    return null;
  }
  let best = null;
  list.forEach((p, i) => {
    WORK_ROLES.forEach(r => {
      if (remain(p, r) <= 0.01) return;
      const sc = (roleHired(r) ? 0 : 100) + (p.pri ? 50 : 0) - i * 5 + remain(p, r) * 0.01;
      if (!best || sc > best.sc) best = { p, role: r, sc };
    });
  });
  return best;
}
function projectPct(p) {
  let n = 0, d = 0;
  WORK_ROLES.forEach(r => { if (p.need[r]) { n += Math.min(p.done[r] || 0, p.need[r]); d += p.need[r]; } });
  return d ? n / d : 1;
}
function offerInterval() {
  const jet = S.workers.jet.hired ? S.workers.jet.lvl * 0.1 : 0;
  return 170 / (1 + 0.3 * S.tier + jet + 0.25 * S.items.billboard) * rand(0.8, 1.2);
}
function makeOffer(vip) {
  const w = TEMPLATES.map(t => t.roles.reduce((s, r) => s + (roleHired(r) ? 3 : 1), 0));
  let x = Math.random() * w.reduce((a, b) => a + b, 0), ti = 0;
  for (; ti < w.length - 1; ti++) { x -= w[ti]; if (x <= 0) break; }
  const t = TEMPLATES[ti], c = pick(CLIENTS);
  const scale = (1 + 0.22 * S.tier + 0.1 * (S.rep - 1)) * (vip ? 1.8 : 1);
  const need = {};
  t.roles.forEach(r => { need[r] = (need[r] || 0) + Math.round(rand(55, 105) * scale / 5) * 5; });
  const total = Object.values(need).reduce((a, b) => a + b, 0);
  const payout = Math.round(total * rand(3.4, 4.3) * (1 + 0.1 * (S.rep - 1)) * (vip ? 1.5 : 1) / 10) * 10;
  return {
    id: S.nid++, name: c[0] + ' — ' + t.name, client: c[0], emoji: c[1], need, payout,
    rep: +(0.05 + total / 2600).toFixed(3), days: Math.max(2, Math.round(1.2 + total / 140)),
    expT: tNow() + DAY_MIN * (vip ? 2.5 : 1.8), vip: !!vip, stars: total > 330 ? 3 : total > 200 ? 2 : 1,
  };
}
function acceptOffer(id) {
  const o = S.offers.find(x => x.id === id);
  if (!o) return;
  if (S.active.length >= maxSlots()) { toast('All project slots are busy — finish one or buy a Server Rack.', 'bad'); sfx('err'); return; }
  const g = S.workers.gradley, cap = S.workers.captain, board = S.items.board;
  const cut = (g.hired ? 0.02 * g.lvl : 0) + 0.05 * board;
  const need = {};
  Object.keys(o.need).forEach(r => { need[r] = Math.max(5, Math.round(o.need[r] * (1 - cut))); });
  const extra = cap.hired ? 0.25 * cap.lvl : 0;
  S.active.push({
    id: o.id, name: o.name, client: o.client, emoji: o.emoji, need, done: {}, payout: o.payout, rep: o.rep,
    dueDay: S.day + Math.round(o.days + extra), late: false, pri: false, vip: o.vip, stars: o.stars,
  });
  S.offers = S.offers.filter(x => x.id !== id);
  sfx('click'); uiDirty('all');
  if (S.tip < 1) S.tip = 1;
}
function togglePriority(pid) {
  const p = S.active.find(x => x.id === pid); if (!p) return;
  const was = p.pri; S.active.forEach(x => x.pri = false); p.pri = !was;
  sfx('click'); uiDirty('projects');
}
function completeProject(p) {
  const buck = S.workers.buck, jet = S.workers.jet;
  const mult = (1 + (buck.hired ? 0.04 * buck.lvl : 0) + 0.04 * S.items.billboard) * (p.late ? 0.5 : 1);
  const pay = Math.round(p.payout * mult);
  const gain = p.late ? -0.02 : p.rep * (1 + (jet.hired ? 0.06 * jet.lvl : 0)) * (1 + 0.0);
  S.cash += pay; S.totalRev += pay; S.today.rev += pay; S.done++; S.today.done++;
  if (p.late) S.late++; else S.onTime++;
  S.rep = clamp(S.rep + gain, 0, 5);
  S.active = S.active.filter(x => x !== p);
  S.workers.king.dpts += 0;
  burst(480, 300, 36); floatText(480, 280, '+' + money(pay), '#7dffa8', true, 1.6);
  sfx('coin'); logMsg(`✅ ${p.name} delivered${p.late ? ' (late)' : ''}: +${money(pay)}`);
  toast(`Delivered “${p.name}” +${money(pay)}`, 'good');
  checkAch(); uiDirty('all');
}

/* ---------- worker AI ---------- */
function goBreak(f, forced) {
  const w = S.workers[f.id], r = R.w[f.id];
  let kind = 'couch';
  if (S.items.ping > 0 && w.mood < 65 && Math.random() < 0.7) kind = 'ping';
  else if (w.energy < 40 || Math.random() < 0.5) kind = 'coffee';
  const off = (f.slot % 3 - 1) * 26;
  let spot;
  if (kind === 'ping') spot = PANTRY.ping[f.slot % 2];
  else if (kind === 'coffee') spot = { x: PANTRY.coffee.x + off, y: PANTRY.coffee.y + 14 + (f.slot % 2) * 10 };
  else spot = { x: PANTRY.couch.x + off, y: PANTRY.couch.y };
  r.spotKind = kind; r.state = 'toBreak'; r.forced = false;
  r.restUntil = R.time + (forced ? 7 : 0);
  r.path = [{ x: r.x, y: CORRIDOR_Y }, PANTRY.hub, spot];
}
function goSeat(f) {
  const r = R.w[f.id], s = seatOf(f);
  r.state = 'toSeat'; r.path = [PANTRY.hub, { x: s.x, y: CORRIDOR_Y }, s];
}
function say(f, text, t) { const r = R.w[f.id]; r.say = text; r.sayT = t || 2.8; voice(f.id); }

function updateWorker(f, g) {
  const w = S.workers[f.id]; if (!w.hired) return;
  const r = R.w[f.id];
  w.cd = Math.max(0, w.cd - g); w.pep = Math.max(0, w.pep - g); w.cof = Math.max(0, w.cof - g);
  r.sayT = Math.max(0, r.sayT - g);
  r.bob += g * (r.walking ? 11 : 2.4);
  if (r.path.length) {
    const t = r.path[0], dx = t.x - r.x, dy = t.y - r.y, d = Math.hypot(dx, dy), sp = 130 * g;
    if (d <= sp) { r.x = t.x; r.y = t.y; r.path.shift(); }
    else { r.x += dx / d * sp; r.y += dy / d * sp; if (Math.abs(dx) > 1.5) r.face = dx > 0 ? 1 : -1; }
    r.walking = true;
  } else r.walking = false;

  const late = S.active.filter(p => p.late).length;
  const target = 62 + 6 * S.items.plants + (S.workers.ducky.hired ? 6 : 0) - (w.energy < 35 ? 18 : 0) - late * 5;
  if (r.state === 'seat') {
    const task = pickTask(f); r.task = task;
    if (task) {
      const rt = rateOf(f), add = Math.min(remain(task.p, task.role), rt * g);
      task.p.done[task.role] = (task.p.done[task.role] || 0) + add; w.pts += add; w.dpts += add;
      w.energy = Math.max(0, w.energy - 0.55 * g);
      r.workFx += g;
      if (r.workFx > 2.6) {
        r.workFx = 0;
        floatText(r.x + rand(-12, 12), r.y - 104, '+' + Math.max(1, Math.round(rt * 2.6)), ROLES[task.role].color, false);
      }
    } else w.energy = Math.min(100, w.energy + 0.25 * g);
    let dm = (target - w.mood) * 0.02 * g;
    if (dm < 0 && S.workers.ducky.hired) dm *= 0.7;
    w.mood = clamp(w.mood + dm, 0, 100);
    if (w.energy <= 18 || r.forced) goBreak(f, r.forced);
  } else if (r.state === 'toBreak') {
    if (!r.path.length) r.state = 'rest';
  } else if (r.state === 'rest') {
    const rec = 5 * (1 + 0.25 * S.items.coffee) * (S.workers.ducky.hired ? 1.25 : 1);
    w.energy = Math.min(100, w.energy + rec * g);
    w.mood = Math.min(100, w.mood + (r.spotKind === 'ping' ? 2.4 : 0.9) * g);
    if (w.energy >= 85 && R.time >= r.restUntil) goSeat(f);
  } else if (r.state === 'toSeat') {
    if (!r.path.length) r.state = 'seat';
  }
  r.sayNext -= g;
  if (r.sayNext <= 0) { r.sayNext = rand(12, 26); if (r.sayT <= 0) say(f, pick(f.quips)); }
}

/* ---------- main update ---------- */
function update(dt) {
  if (!S || R.paused || R.modalOpen) return;
  const g = Math.min(dt, 0.1) * R.speed;
  R.time += g;
  S.minute += g * DAY_MIN / DAY_SECONDS;
  const tn = tNow();
  if (S.offers.some(o => o.expT <= tn)) { S.offers = S.offers.filter(o => o.expT > tn); uiDirty('projects'); }
  if (tn >= S.nextOfferT) {
    if (S.offers.length < 5) { S.offers.push(makeOffer(false)); uiDirty('projects'); }
    S.nextOfferT = tn + offerInterval();
  }
  FOMIES.forEach(f => updateWorker(f, g));
  for (const p of S.active.slice()) if (WORK_ROLES.every(r => remain(p, r) <= 0.01)) completeProject(p);
  if (S.dayEvents.length && S.minute >= S.dayEvents[0]) { S.dayEvents.shift(); triggerEvent(); }
  R.achT += g; R.saveT += g;
  if (R.achT > 3) { R.achT = 0; checkAch(); }
  if (R.saveT > 25) { R.saveT = 0; saveGame(); }
  if (!S.won && S.tier === 2 && S.cash >= WIN_CASH) { S.won = true; unlock('ipo'); showWin(); return; }
  if (S.minute >= DAY_END) { S.minute = DAY_END; endDay(); }
}

/* ---------- particles ---------- */
function floatText(x, y, text, color, big, life) {
  R.floats.push({ x, y, text, color, big: !!big, life: life || 1.3, max: life || 1.3 });
}
function burst(x, y, n) {
  const cols = ['#ffd400', '#9fe7c0', '#ff8fb1', '#7aa2ff', '#ffffff', '#ff7a59'];
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI, 0), s = rand(120, 380);
    R.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: rand(0, 6), vr: rand(-9, 9),
      life: rand(0.9, 1.7), max: 1.7, col: pick(cols), size: rand(4, 8) });
  }
}
function updateParticles(dt) {
  for (const p of R.parts) { p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
  R.parts = R.parts.filter(p => p.life > 0);
  for (const f of R.floats) { f.y -= 28 * dt; f.life -= dt; }
  R.floats = R.floats.filter(f => f.life > 0);
}

/* ---------- day cycle ---------- */
function endDay() {
  R.modalOpen = true;
  const notes = [], rep0 = S.today.repStart;
  S.active.slice().forEach(p => {
    if (S.day >= p.dueDay + 1) {
      const fee = Math.round(p.payout * 0.15);
      S.cash -= fee; S.rep = clamp(S.rep - 0.2, 0, 5); S.failed++;
      S.active = S.active.filter(x => x !== p);
      notes.push(`💥 “${p.name}” collapsed. Client penalty ${money(fee)} and −0.2★.`);
    } else if (S.day >= p.dueDay && !p.late) {
      p.late = true; S.rep = clamp(S.rep - 0.08, 0, 5);
      notes.push(`⏰ “${p.name}” is now LATE — payout is halved and it fails tomorrow night.`);
    }
  });
  const salaries = hiredList().reduce((s, f) => s + salaryOf(f), 0), rent = TIERS[S.tier].rent;
  S.cash -= salaries + rent;
  let top = null;
  hiredList().forEach(f => { const w = S.workers[f.id]; if (w.dpts > 1 && (!top || w.dpts > S.workers[top.id].dpts)) top = f; });
  S.bestDay = Math.max(S.bestDay, S.today.rev);
  const report = { day: S.day, rev: S.today.rev, done: S.today.done, salaries, rent, net: S.today.rev - salaries - rent,
    cash: S.cash, repDelta: S.rep - rep0, notes, top: top ? top.id : null, topPts: top ? Math.round(S.workers[top.id].dpts) : 0 };
  checkAch(); saveGame(); sfx('chime');
  if (S.cash < -1000) { showGameOver(report); return; }
  showDayReport(report);
}
function scheduleEvents() {
  S.dayEvents = [];
  if (S.day < 2) return;
  const n = (Math.random() < 0.8 ? 1 : 0) + (S.day >= 8 && Math.random() < 0.45 ? 1 : 0);
  for (let i = 0; i < n; i++) S.dayEvents.push(randi(DAY_START + 70, DAY_END - 100));
  S.dayEvents.sort((a, b) => a - b);
}
function startNextDay() {
  S.day++; S.minute = DAY_START;
  FOMIES.forEach(f => {
    const w = S.workers[f.id]; if (!w.hired) return;
    w.energy = Math.min(100, w.energy + 55 + (S.workers.ducky.hired ? 10 : 0));
    w.mood = clamp(w.mood + 6, 0, 100); w.dpts = 0;
    const r = R.w[f.id], s = seatOf(f);
    r.x = s.x; r.y = s.y; r.path = []; r.state = 'seat'; r.forced = false;
  });
  S.today = { rev: 0, done: 0, exp: 0, repStart: S.rep };
  while (S.offers.length < 3) S.offers.push(makeOffer(false));
  S.nextOfferT = tNow() + offerInterval() * 0.6;
  scheduleEvents();
  saveGame(); R.modalOpen = false;
  logMsg(`☀️ Day ${S.day} begins.`);
  uiDirty('all');
}

/* ---------- player actions ---------- */
function hire(id) {
  const f = FOMIE[id], w = S.workers[id];
  if (w.hired) return;
  if (staffCount() >= capacity()) { toast('No free desk — upgrade your office first.', 'bad'); sfx('err'); return; }
  if (S.cash < f.hire) { toast('Not enough cash to hire ' + f.name + '.', 'bad'); sfx('err'); return; }
  S.cash -= f.hire; w.hired = true; w.energy = 100; w.mood = 85; w.cd = 0;
  const r = R.w[id], s = seatOf(f);
  r.x = -30; r.y = CORRIDOR_Y; r.state = 'toSeat'; r.path = [{ x: s.x, y: CORRIDOR_Y }, s];
  R.sel = id; burst(s.x, s.y - 60, 28); sfx('hire'); voice(id);
  toast(`${f.name} joined as ${ROLES[f.role].label}!`, 'good'); logMsg(`🎉 ${f.name} was hired (${ROLES[f.role].label}).`);
  if (S.tip < 2) S.tip = 2;
  checkAch(); uiDirty('all');
}
function trainFomie(id) {
  const w = S.workers[id], c = trainCost(w.lvl);
  if (!w.hired || w.lvl >= MAX_LVL || S.cash < c) { sfx('err'); return; }
  S.cash -= c; w.lvl++; sfx('level');
  const r = R.w[id]; floatText(r.x, r.y - 110, 'LEVEL ' + w.lvl + '!', '#ffd400', true, 1.6); burst(r.x, r.y - 60, 14);
  uiDirty('team');
}
function upgradeDesk(id) {
  const w = S.workers[id], c = deskCost(w.desk);
  if (!w.hired || w.desk >= MAX_DESK || S.cash < c) { sfx('err'); return; }
  S.cash -= c; w.desk++; sfx('level'); R.staticDirty = true; uiDirty('team');
}
function giveCoffee(id) {
  const w = S.workers[id];
  if (!w.hired || S.cash < 15 || w.cof > 0 || w.energy >= 99) { sfx('err'); return; }
  S.cash -= 15; w.energy = Math.min(100, w.energy + 35); w.cof = 8; S.coffees++;
  const r = R.w[id]; floatText(r.x, r.y - 110, '☕ +35', '#ffd9a0', true, 1.3); sfx('sip'); uiDirty('team');
}
function pepTalk(id) {
  const w = S.workers[id];
  if (!w.hired || w.pep > 0 || w.mood >= 99) { sfx('err'); return; }
  w.mood = Math.min(100, w.mood + 15); w.pep = 20;
  const r = R.w[id]; floatText(r.x, r.y - 110, '💖 +15', '#ff9fc4', true, 1.3); sfx('click'); uiDirty('team');
}
function sendBreak(id) {
  const r = R.w[id];
  if (!S.workers[id].hired || r.state !== 'seat') { sfx('err'); return; }
  r.forced = true; sfx('click');
}
function upgradeTier() {
  const nx = TIERS[S.tier + 1];
  if (!nx || S.cash < nx.cost) { sfx('err'); return; }
  S.cash -= nx.cost; S.tier++; R.staticDirty = true; burst(480, 280, 60); sfx('level');
  toast('Welcome to the ' + nx.name + '!', 'good'); logMsg('🏢 Moved into the ' + nx.name + '.');
  checkAch(); uiDirty('all');
}
function buyItem(id) {

/* ============ FOMIES COMPANY — sound engine (all synthesized, no audio files) ============ */
let AC = null, muted = false, musicOff = false;
try { muted = localStorage.getItem('fomies_muted') === '1'; musicOff = localStorage.getItem('fomies_music') === '0'; } catch (e) { /* ignore */ }
const AU = { master: null, music: null, sfx: null, noise: null, timer: null, amb: null, nextT: 0, step: 0, bar: 0, song: null, started: false, lastVoice: 0 };
const mf = n => 440 * Math.pow(2, (n - 69) / 12);

function audioCtx() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
      AU.master = AC.createGain(); AU.master.gain.value = 0.9;
      AU.music = AC.createGain(); AU.music.gain.value = 0.0001;
      AU.sfx = AC.createGain(); AU.sfx.gain.value = 1;
      AU.music.connect(AU.master); AU.sfx.connect(AU.master); AU.master.connect(comp); comp.connect(AC.destination);
      const len = AC.sampleRate; AU.noise = AC.createBuffer(1, len, AC.sampleRate);
      const d = AU.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});

/* one oscillator note at absolute time t. o: attack, f1 (glide target), det, filt [type,freq,q], sus+rel (pad shape) */
function osc(f, t, dur, type, vol, dest, o) {

  os.type = type || 'sine'; os.frequency.setValueAtTime(f, t);
  if (o.f1) os.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  if (o.det) os.detune.value = o.det;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + at);
  if (o.sus) { g.gain.setValueAtTime(v, t + Math.max(at, dur - (o.rel || 0.3))); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  else g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  if (o.filt) { const fl = a.createBiquadFilter(); fl.type = o.filt[0]; fl.frequency.value = o.filt[1]; fl.Q.value = o.filt[2] || 1; os.connect(fl); fl.connect(g); } else os.connect(g);
  g.connect(dest); os.start(t); os.stop(t + dur + 0.05);
}
function noiseHit(t, dur, vol, ft, ff, dest, q) {
  const a = AC, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = AU.noise; f.type = ft; f.frequency.value = ff; f.Q.value = q || 0.8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}

/* ---------- sound effects ---------- */
function sfx(n) {
  if (muted) return; const a = audioCtx(); if (!a || a.state !== 'running') return;
  const t = a.currentTime, D = AU.sfx, o = (f, d, ty, v, dl, op) => osc(f, t + (dl || 0), d, ty, v, D, op);
  switch (n) {
    case 'click': o(720, 0.07, 'triangle', 0.06, 0, { f1: 520 }); break;
    case 'coin': // cash register
      noiseHit(t, 0.04, 0.05, 'highpass', 5000, D); o(1568, 0.09, 'square', 0.03);
      o(2093, 0.55, 'sine', 0.06, 0.07); o(3136, 0.4, 'sine', 0.025, 0.07); break;
    case 'err':
      o(220, 0.13, 'sawtooth', 0.05, 0, { f1: 170, filt: ['lowpass', 900] });
      o(165, 0.22, 'sawtooth', 0.05, 0.12, { f1: 120, filt: ['lowpass', 900] }); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => o(f, 0.2, 'triangle', 0.07, i * 0.07)); o(2093, 0.45, 'sine', 0.03, 0.28); break;
    case 'hire': // team-joined fanfare
      [392, 523, 659, 784, 1047].forEach((f, i) => { o(f, 0.2, 'square', 0.03, i * 0.08); o(f, 0.34, 'triangle', 0.06, i * 0.08); });
      noiseHit(t + 0.4, 0.45, 0.025, 'highpass', 6500, D); break;
    case 'chime': [659, 880, 1319].forEach((f, i) => o(f, 0.7, 'sine', 0.07, i * 0.14)); break; // end of day
    case 'event': for (let i = 0; i < 3; i++) { o(880, 0.07, 'square', 0.028, i * 0.17); o(660, 0.07, 'square', 0.028, i * 0.17 + 0.08); } break; // phone trill
    case 'sip': o(260, 0.2, 'sine', 0.06, 0, { f1: 520 }); o(330, 0.14, 'sine', 0.04, 0.18, { f1: 200 }); noiseHit(t, 0.25, 0.02, 'bandpass', 2500, D, 2); break;
    case 'win': // IPO bell + fanfare
      [0, 0.9, 1.8].forEach(dl => { o(440, 2.2, 'sine', 0.09, dl); o(880, 1.6, 'sine', 0.04, dl); o(1320, 1.1, 'sine', 0.025, dl); });
      [523, 659, 784, 1047, 1319].forEach((f, i) => { o(f, 0.4, 'triangle', 0.07, 0.1 + i * 0.12); o(f, 0.3, 'square', 0.025, 0.1 + i * 0.12); });
      o(1047, 1.4, 'triangle', 0.06, 0.8); o(1319, 1.4, 'triangle', 0.05, 0.8); o(1568, 1.4, 'triangle', 0.05, 0.8); break;
  }
}

/* ---------- background music: procedural lo-fi office loop, evolves with each office tier ---------- */
const SONGS = [
  { bpm: 84, hat: 2, prog: [ // Garage: mellow
    { r: 48, c: [60, 64, 67, 71] }, { r: 45, c: [57, 60, 64, 67] }, { r: 50, c: [57, 60, 65, 69] }, { r: 43, c: [55, 59, 62, 65] } ] },
  { bpm: 92, hat: 2, prog: [ // Downtown: warmer

  { bpm: 102, hat: 1, prog: [ // Tower: brighter, busier
    { r: 48, c: [60, 64, 67, 71] }, { r: 43, c: [59, 62, 67, 69] }, { r: 45, c: [57, 60, 64, 67] }, { r: 41, c: [57, 60, 64, 65] } ] },
];
const SCALE = [72, 74, 76, 79, 81, 84, 79, 76];

function musicStep(step, t0, song, ch, bar) {
  const sd = 60 / song.bpm / 4, M = AU.music, t = t0 + (step % 2 ? sd * 0.14 : 0), tier = song === SONGS[2];
  if (step === 0) ch.c.forEach((n, i) => osc(mf(n), t, sd * 16, 'triangle', 0.03, M, { attack: 0.5, sus: 1, rel: 0.7, filt: ['lowpass', 1100, 0.7], det: i * 3 - 4 }));
  if (step === 0 || step === 8 || ((step === 6 || step === 11 || step === 14) && Math.random() < 0.6)) osc(mf(ch.r), t, sd * 3, 'triangle', 0.13, M, { attack: 0.01 });
  if (step === 0 || step === 8 || (step === 10 && Math.random() < 0.4)) osc(120, t, 0.18, 'sine', 0.2, M, { f1: 42, attack: 0.003 });
  if (step === 4 || step === 12) noiseHit(t, 0.13, 0.05, 'bandpass', 1900, M, 0.9);
  if (step % song.hat === 0) noiseHit(t, 0.035, step % 4 === 0 ? 0.03 : 0.018, 'highpass', 7000, M);
  const stab = (bar % 2 ? [0, 5, 10] : [0, 3, 6, 10]).includes(step);
  if (stab) ch.c.forEach((n, i) => { osc(mf(n), t + i * 0.012, 0.55, 'sine', 0.032, M, { attack: 0.006 }); osc(mf(n + 12), t + i * 0.012, 0.3, 'sine', 0.008, M, { attack: 0.006 }); });
  if (step % 2 === 0 && step > 0 && Math.random() < (tier ? 0.42 : 0.26)) osc(mf(SCALE[Math.random() * SCALE.length | 0]), t, 0.7, 'sine', 0.04, M, { attack: 0.01 });
}
function musicTick() {

  AU.music.gain.setTargetAtTime(silent ? 0.0001 : 0.55 * duck, a.currentTime, 0.25);
  if (AU.nextT < a.currentTime - 0.5) AU.nextT = a.currentTime + 0.05; // tab was throttled: don't flood
  while (AU.nextT < a.currentTime + 0.2) {
    if (AU.step === 0) AU.song = SONGS[Math.min(2, (S && S.tier) || 0)];
    const song = AU.song, sd = 60 / song.bpm / 4;

      <button class="btn sm ${maxed ? '' : 'primary'}" ${maxed ? 'disabled' : `data-act="buy:${it.id}" data-afford="${c}"`}>${maxed ? 'MAX' : money(c)}</button></div>`;
  });
  return h;
}
function panelStats() {
  const tot = S.onTime + S.late, ot = tot ? Math.round(S.onTime / tot * 100) + '%' : '—';
  const stat = (k, v) => `<div class="st"><b>${v}</b><span>${k}</span></div>`;
  let h = `<div class="sec-h">Company stats</div><div class="stat-grid">${stat('Total revenue', money(S.totalRev))}${stat('Projects done', S.done)}${stat('On-time rate', ot)}${stat('Best day', money(S.bestDay))}${stat('Failed', S.failed)}${stat('Day', S.day)}</div>
  <div class="sec-h">Achievements <span>${Object.keys(S.ach).length}/${ACHIEVEMENTS.length}</span></div><div class="ach-grid">`;
  ACHIEVEMENTS.forEach(a => { h += `<div class="ach ${S.ach[a.id] ? 'got' : ''}"><b>${S.ach[a.id] ? '🏆' : '🔒'} ${a.name}</b><span>${a.desc}</span></div>`; });
  h += `</div><div class="sec-h">Recent activity</div><div class="logbox">${S.log.slice(0, 10).map(l => `<div><em>D${l.d}</em> ${l.m}</div>`).join('') || '<div class="dim">Nothing yet.</div>'}</div>
  <div class="btn-row"><button class="btn sm" data-m="menu">☰ Menu</button></div>`;
  return h;
}
const BUILDERS = { projects: panelProjects, team: panelTeam, office: panelOffice, stats: panelStats };
function renderPanel() {
  if (!S) return;
  const html = BUILDERS[UI.tab]();
  if (html !== UI.lastHtml) { $('panel').innerHTML = html; UI.lastHtml = html; }
  liveUpdate();
}
function setTab(t) {
  UI.tab = t; UI.lastHtml = '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  renderPanel(); $('panel').scrollTop = 0;
}
function renderLog() {
  if (!S) return;
  $('log').innerHTML = S.log.slice(0, 3).map(l => `<div><em>${l.c}</em> ${l.m}</div>`).join('');
}
function updateHint() {
  const el = $('hint'); if (!S) return;
  if (S.tip === 2 && (staffCount() > 2 || Object.values(S.items).some(v => v > 0) || S.tier > 0)) S.tip = 3;
  const msgs = ['👉 Open the <b>Projects</b> tab on the right and accept your first project.',
    '👆 Nice! Now click a Fomie in the office to give coffee, pep talks and use their special ability.',
    '💼 Earn cash, then <b>hire the crew</b> (Team tab) and upgrade your office.'];
  if (S.tip >= 3 || !UI.started) { el.classList.add('hidden'); return; }
  el.innerHTML = msgs[S.tip] + '<button data-act="hintx" aria-label="dismiss">✕</button>'; el.classList.remove('hidden');
}

/* ---------- live updates ---------- */
function activityText(f) {
  const r = R.w[f.id];
  if (r.state === 'rest') return r.spotKind === 'ping' ? '🏓 Ping-pong break' : r.spotKind === 'coffee' ? '☕ Coffee break' : '🛋️ Couch break';
  if (r.state === 'toBreak') return '🚶 Heading to the pantry';
  if (r.state === 'toSeat') return '🚶 Walking back to desk';
  if (r.task) { const n = r.task.p.name; return '⚙️ ' + (n.length > 26 ? n.slice(0, 25) + '…' : n); }
  return '💭 Waiting for work';
}
function resolveW(key) {
  const a = key.split(':');
  if (a[0] === 'pn') { const p = S.active.find(x => x.id === +a[1]); return p ? (p.done[a[2]] || 0) / p.need[a[2]] : 0; }
  if (a[0] === 'e') return S.workers[a[1]].energy / 100;
  if (a[0] === 'm') return S.workers[a[1]].mood / 100;
  if (a[0] === 'oe') { const o = S.offers.find(x => x.id === +a[1]); return o ? (o.expT - tNow()) / (DAY_MIN * (o.vip ? 2.5 : 1.8)) : 0; }
  return 0;
}
function resolveT(key) {
  const a = key.split(':');
  if (a[0] === 'pt') { const p = S.active.find(x => x.id === +a[1]); return { text: p ? Math.min(p.need[a[2]], Math.floor(p.done[a[2]] || 0)) + '/' + p.need[a[2]] : '' }; }
  if (a[0] === 'due') {
    const p = S.active.find(x => x.id === +a[1]); if (!p) return { text: '' };
    const left = p.dueDay - S.day;
    if (p.late) return { text: '⚠ LATE · half pay', cls: 'bad' };
    return left <= 0 ? { text: '⏰ Due today 6 PM', cls: 'warn' } : { text: '🗓 ' + left + ' day' + (left > 1 ? 's' : '') + ' left', cls: left === 1 ? 'warn' : 'ok' };
  }
  if (a[0] === 'act') return { text: activityText(FOMIE[a[1]]) };
  if (a[0] === 'cdt') { const w = S.workers[a[1]]; return { text: w.cd > 0 ? Math.ceil(w.cd) + 's' : 'READY' }; }
  return { text: '' };
}
function liveUpdate() {
  const P = $('panel'); if (!S) return;
  P.querySelectorAll('[data-w]').forEach(el => { el.style.width = (clamp(resolveW(el.dataset.w), 0, 1) * 100).toFixed(1) + '%'; });
  P.querySelectorAll('[data-t]').forEach(el => { const v = resolveT(el.dataset.t); if (el.textContent !== v.text) el.textContent = v.text; if (v.cls !== undefined) el.className = (el.dataset.base || '') + ' ' + v.cls; });
  P.querySelectorAll('[data-afford]').forEach(el => el.classList.toggle('off', S.cash < Number(el.dataset.afford)));
  P.querySelectorAll('[data-cdbtn]').forEach(el => el.classList.toggle('off', S.workers[el.dataset.cdbtn].cd > 0));
}
function updateHud() {
  if (!S) return;
  UI.cashShown += (S.cash - UI.cashShown) * 0.25; if (Math.abs(S.cash - UI.cashShown) < 1) UI.cashShown = S.cash;
  $('cash').textContent = money(UI.cashShown); $('cash').classList.toggle('neg', S.cash < 0);
  $('dayLbl').textContent = 'DAY ' + S.day; $('clock').textContent = fmtClock(S.minute);
  $('dayBar').style.width = ((S.minute - DAY_START) / DAY_MIN * 100).toFixed(1) + '%';
  $('repFg').style.width = (S.rep / 5 * 100).toFixed(1) + '%'; $('repNum').textContent = S.rep.toFixed(1);
  const hl = hiredList(), mood = hl.reduce((s, f) => s + S.workers[f.id].mood, 0) / Math.max(1, hl.length);
  $('moraleBar').style.width = mood.toFixed(0) + '%'; $('moraleBar').style.background = mood < 30 ? '#ff5a6e' : mood < 55 ? '#ffb347' : '#5dff9c';
  $('moraleTxt').textContent = Math.round(mood) + '%';
  $('tierName').textContent = TIERS[S.tier].name;
  $('bdgProjects').textContent = S.offers.length || ''; $('bdgProjects').style.display = S.offers.length ? '' : 'none';
  ['0', '1', '2', '3'].forEach(k => $('spd' + k).classList.toggle('on', k === '0' ? R.paused : (!R.paused && R.speed === +k)));
  $('mute').textContent = muted ? '🔇' : '🔊';
}

/* ---------- modals: day report, events, hire, end states ---------- */
function showDayReport(rp) {
  const top = rp.top ? `<div class="top-perf"><img src="${img(rp.top)}"><div><b>Top performer</b><span>${FOMIE[rp.top].name} · ${rp.topPts} work points</span></div></div>` : '';
  const row = (k, v, c) => `<div class="rrow"><span>${k}</span><b class="${c || ''}">${v}</b></div>`;
  const tips = ['Tired Fomies work slowly — keep an eye on the red energy bars.', 'Click ⚡ on a project to make everyone work on it first.', 'Unhired roles are covered only by Kingsley, at 60% speed.', 'Ping-pong breaks restore mood much faster.', 'Abilities have cooldowns, not costs — use them often.', 'A Server Rack lets you run more projects at once.'];
  showModal(`<h2>🌙 Day ${rp.day} wrap-up</h2>
    <div class="report">${row('Projects delivered', rp.done)}${row('Revenue', money(rp.rev), 'pos')}${row('Salaries', '−' + money(rp.salaries), 'neg')}${row('Rent', '−' + money(rp.rent), 'neg')}${row('Net today', (rp.net >= 0 ? '+' : '') + money(rp.net), rp.net >= 0 ? 'pos' : 'neg')}${row('Cash on hand', money(rp.cash), rp.cash < 0 ? 'neg' : '')}${row('Reputation', S.rep.toFixed(2) + '★ (' + (rp.repDelta >= 0 ? '+' : '') + rp.repDelta.toFixed(2) + ')')}</div>
    ${top}${rp.notes.map(n => `<div class="note">${n}</div>`).join('')}
    ${rp.cash < 0 ? '<div class="note bad">⚠ You are in the red. Below −$1,000 the company goes bankrupt!</div>' : ''}
    <p class="tipline">💡 ${pick(tips)}</p><button class="btn primary big" data-m="next">Start Day ${rp.day + 1} →</button>`, 'report-card');
}
function showEvent(ev) {
  UI.ev = ev;
  showModal(`<div class="ev-emoji">${ev.emoji}</div><h2>${ev.title}</h2><p>${ev.text}</p><div class="choices">${ev.choices.map((c, i) =>
    `<button class="btn choice ${c.cost && S.cash < c.cost ? 'off' : ''}" data-m="ev:${i}"><b>${c.label}</b><span>${c.sub}</span></button>`).join('')}</div>`, 'event-card');
}
function showHireConfirm(id) {
  const f = FOMIE[id], full = staffCount() >= capacity(), poor = S.cash < f.hire;
  showModal(`<div class="hire-top"><img class="avatar big" src="${img(id)}" style="border-color:${ROLES[f.role].color}"><div><h2>${f.name}</h2><span class="role" style="--c:${ROLES[f.role].color}">${ROLES[f.role].icon} ${ROLES[f.role].label}</span></div></div>
    <p>${f.blurb}</p><p class="dim">⭐ ${f.passive}<br>⚡ <b>${f.abilityName}</b>: ${f.abilityDesc}</p>
    <div class="report">${`<div class="rrow"><span>Hiring cost</span><b>${money(f.hire)}</b></div><div class="rrow"><span>Salary</span><b>${money(f.salary)}/day</b></div>`}</div>
    ${full ? '<div class="note bad">No free desk! Upgrade your office first.</div>' : poor ? '<div class="note bad">Not enough cash yet.</div>' : ''}
    <div class="btn-row"><button class="btn" data-m="close">Not now</button><button class="btn primary ${full || poor ? 'off' : ''}" data-m="hire:${id}">Hire ${f.name}</button></div>`);
}
function showWin() {
  burst(480, 280, 120); sfx('win'); R.modalOpen = true;
  showModal(`<div class="ev-emoji">🔔</div><h2>IPO DAY!</h2><p><b>Fomies Company</b> just rang the opening bell with <b>${money(S.cash)}</b> in the bank, ${S.done} projects delivered and a ${S.rep.toFixed(1)}★ reputation. Every Fomie is now a (paper) millionaire.</p>
    <div class="btn-col"><button class="btn primary big" data-m="close">Keep playing</button><button class="btn" data-m="title">Back to title</button></div>`, 'event-card');
}
function showGameOver(rp) {
  wipeSave();
  showModal(`<div class="ev-emoji">📉</div><h2>Bankrupt!</h2><p>After ${rp.day} days the Fomies ran out of runway (${money(rp.cash)}). The snake was last seen leaving with the crown.</p>
    <div class="report">${`<div class="rrow"><span>Projects delivered</span><b>${S.done}</b></div><div class="rrow"><span>Total revenue</span><b>${money(S.totalRev)}</b></div>`}</div>
    <button class="btn primary big" data-m="new">Try again</button>`, 'event-card');
}
function menuHtml() {
  return `<h2>Menu</h2><div class="btn-col">
    <button class="btn primary" data-m="close">Resume</button>
    <button class="btn" data-m="save">💾 Save now</button>
    <button class="btn" data-m="mute">${muted ? '🔇 Sound: off' : '🔊 Sound: on'}</button>
    <button class="btn" data-m="music">${musicOff ? '🎵 Music: off' : '🎵 Music: on'}</button>
    <button class="btn" data-m="help2">How to play</button>
    <button class="btn" data-m="title">Quit to title</button></div>`;
}

/* ---------- game start ---------- */
function startNew() {
  wipeSave(); S = newState(); initRuntime();
  S.offers = [makeOffer(false), makeOffer(false), makeOffer(false)];
  S.nextOfferT = tNow() + offerInterval();
  scheduleEvents();
  UI.cashShown = S.cash; UI.started = true; R.speed = 1; R.paused = false;
  closeModal(); setTab('projects'); uiDirty('all'); renderLog(); updateHint();
}
function continueGame() {
  if (!loadGame()) { startNew(); return; }
  initRuntime(); UI.cashShown = S.cash; UI.started = true; R.speed = 1; R.paused = false;
  if (S.minute >= DAY_END) { closeModal(); startNextDay(); }
  while (S.offers.length < 3) S.offers.push(makeOffer(false));
  if (!S.nextOfferT || S.nextOfferT < tNow()) S.nextOfferT = tNow() + offerInterval();
  closeModal(); setTab('projects'); uiDirty('all'); renderLog(); updateHint();
}

/* ---------- input ---------- */
function doAction(s, el) {
  const [a, b] = s.split(':');
  if (el && el.classList.contains('off') && el.dataset.afford && S.cash < Number(el.dataset.afford)) { toast('Not enough cash.', 'bad'); sfx('err'); return; }
  switch (a) {
    case 'accept': acceptOffer(+b); break;
    case 'rush': togglePriority(+b); break;
    case 'sel': R.sel = R.sel === b ? null : b; if (R.sel && S.tip === 1) S.tip = 2; sfx('click'); uiDirty('team'); updateHint(); break;
    case 'hire': showHireConfirm(b); break;
    case 'coffee': giveCoffee(b); break;
    case 'pep': pepTalk(b); break;
    case 'break': sendBreak(b); break;
    case 'train': trainFomie(b); break;
    case 'desk': upgradeDesk(b); break;
    case 'ability': useAbility(b); break;
    case 'tier': upgradeTier(); break;
    case 'buy': buyItem(b); break;
    case 'hintx': S.tip = 3; updateHint(); break;
  }
  uiDirty(UI.tab);
}
function handleModal(s) {
  const [a, b] = s.split(':');
  switch (a) {
    case 'close': closeModal(); break;
    case 'next': closeModal(); startNextDay(); break;
    case 'new': startNew(); break;
    case 'continue': continueGame(); break;
    case 'help': showModal(helpHtml('titleback'), 'help-card'); break;
    case 'help2': showModal(helpHtml('menu'), 'help-card'); break;
    case 'titleback': showTitle(); break;
    case 'menu': showModal(menuHtml(), 'menu-card'); break;
    case 'save': saveGame(); toast('Game saved.', 'good'); break;
    case 'mute': muted = !muted; try { localStorage.setItem('fomies_muted', muted ? '1' : '0'); } catch (e) { /* ignore */ } showModal(menuHtml(), 'menu-card'); break;
    case 'music': musicOff = !musicOff; try { localStorage.setItem('fomies_music', musicOff ? '0' : '1'); } catch (e) { /* ignore */ } showModal(menuHtml(), 'menu-card'); break;
    case 'title': if (UI.started && S) saveGame(); showTitle(); break;
    case 'hire': closeModal(); hire(b); break;
    case 'ev': {
      const res = resolveEvent(UI.ev, +b);
      if (res === null) { toast('Not enough cash for that option.', 'bad'); break; }
      sfx('click');
      showModal(`<div class="ev-emoji">${UI.ev.emoji}</div><h2>${UI.ev.title}</h2><p class="result">${res}</p><button class="btn primary big" data-m="close">Back to work</button>`, 'event-card');
      break;
    }
  }
}
function setSpeed(k) {
  if (k === 0) R.paused = !R.paused; else { R.paused = false; R.speed = k; }
  sfx('click'); updateHud();
}
function bindUI() {
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-m]');
    if (m && !m.classList.contains('off')) { handleModal(m.dataset.m); return; }
    if (m && m.classList.contains('off')) { sfx('err'); return; }
    const a = e.target.closest('[data-act]');
    if (a && S) { if (a.disabled) return; doAction(a.dataset.act, a); return; }
    const t = e.target.closest('#tabs button'); if (t) { sfx('click'); setTab(t.dataset.tab); }
  });
  [0, 1, 2, 3].forEach(k => $('spd' + k).addEventListener('click', () => setSpeed(k)));
  $('mute').addEventListener('click', () => { muted = !muted; try { localStorage.setItem('fomies_muted', muted ? '1' : '0'); } catch (e) { /* ignore */ } sfx('click'); updateHud(); });
  $('menuBtn').addEventListener('click', () => { if (UI.started && !R.modalOpen) showModal(menuHtml(), 'menu-card'); });
  window.addEventListener('keydown', e => {
    if (!UI.started || R.modalOpen) return;
    if (e.code === 'Space') { e.preventDefault(); setSpeed(0); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') setSpeed(+e.key);
  });
  cv.addEventListener('pointermove', e => {
    if (!S || !UI.started) return;
    const p = canvasPoint(e), id = hitFomie(p), tip = $('tip');
    R.hover = id;
    const hd = !id && hitDesk(p);
    cv.style.cursor = id || hd ? 'pointer' : 'default';
    if (id) {
      const w = S.workers[id], f = FOMIE[id], b = cv.parentElement.getBoundingClientRect();
      tip.innerHTML = `<b>${f.name}</b> · ${ROLES[f.role].label}<br>⚡ ${Math.round(w.energy)}  💖 ${Math.round(w.mood)}  · Lv ${w.lvl}`;
      tip.style.left = (e.clientX - b.left + 14) + 'px'; tip.style.top = (e.clientY - b.top + 14) + 'px'; tip.classList.remove('hidden');
    } else if (hd) {
      const f = FOMIE[hd], b = cv.parentElement.getBoundingClientRect();
      tip.innerHTML = `<b>Empty desk</b><br>Click to hire ${f.name} (${ROLES[f.role].label}) · ${money(f.hire)}`;
      tip.style.left = (e.clientX - b.left + 14) + 'px'; tip.style.top = (e.clientY - b.top + 14) + 'px'; tip.classList.remove('hidden');
    } else tip.classList.add('hidden');
  });
  cv.addEventListener('pointerleave', () => { R.hover = null; $('tip').classList.add('hidden'); });
  cv.addEventListener('click', e => {
    if (!S || !UI.started || R.modalOpen) return;
    const p = canvasPoint(e), id = hitFomie(p);
    if (id) { R.sel = id; if (S.tip === 1) S.tip = 2; sfx('click'); setTab('team'); updateHint(); return; }
    const d = hitDesk(p); if (d) { sfx('click'); showHireConfirm(d); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && UI.started && !R.modalOpen) { R.paused = true; updateHud(); } });
  window.addEventListener('beforeunload', () => { if (S && UI.started) saveGame(); });
  window.addEventListener('resize', resizeCanvas);
}
function uiService() {
  const d = UI.dirty, keys = Object.keys(d); if (!keys.length) return;
  UI.dirty = {};
  if (d.all || d[UI.tab]) renderPanel();
  if (d.all || d.log) renderLog();
  if (d.all) updateHint();
}

'use strict';
/* ============ FOMIES COMPANY — boot ============ */
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  try {
    update(dt);
    if (S) {
      updateParticles(dt);
      UI.hudT += dt; UI.liveT += dt;
      if (UI.hudT > 0.08) { UI.hudT = 0; updateHud(); }
      if (UI.liveT > 0.15) { UI.liveT = 0; liveUpdate(); }
      uiService();
      drawFrame();
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
window.addEventListener('load', () => {
  resizeCanvas(); bindUI();
  S = newState(); initRuntime();
  loadImages(IMG_DATA, () => {
    updateHud(); showTitle(); setTab('projects');
    requestAnimationFrame(frame);
  });
});


</script>
</body>
</html>
